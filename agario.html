<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 Agar.io Web - Bilişim Sınıfı Portalı</title>
    <link rel="stylesheet" href="bgm.css">
    <link rel="stylesheet" href="agario.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔴</text></svg>">
</head>
<body>

<canvas id="agar-canvas"></canvas>

<!-- TOP OVERLAY -->
<div class="agar-top-bar">
    <a href="/" class="btn-agar-back">◀ PORTALA DÖN</a>
    <div class="agar-stats-badge">
        <span>KÜTLE:</span>
        <strong id="agar-mass-val">25</strong>
    </div>
    <div id="agar-admin-controls" class="agar-admin-controls hidden">
        <button id="btn-admin-add-mass" class="btn-admin-agar">🍔 +1000 Kütle (Admin)</button>
    </div>
</div>

<!-- LEADERBOARD (Top Right) -->
<div class="agar-leaderboard">
    <div class="lb-title">🏆 LİDERLİK TABLOSU</div>
    <ol id="agar-lb-list">
        <li>1. Yükleniyor...</li>
    </ol>
</div>

<!-- SPAWN / LOGIN OVERLAY -->
<div id="agar-modal" class="agar-modal-backdrop">
    <div class="agar-modal-card">
        <h1>AGAR.IO WEB</h1>
        <h3>BİLİŞİM SINIFI HÜCRE SAVAŞI</h3>
        <p style="color:#aaa; font-size:12px; margin-bottom:14px;">Renkli yemleri topla, devasa boyuta ulaş ve sınıftaki arkadaşlarını yut!</p>

        <div class="agar-form-group">
            <label>Hücre İsmin:</label>
            <input type="text" id="agar-nickname" maxlength="15" placeholder="Takma adın...">
        </div>

        <div class="agar-controls-hint">
            <span>🖱️ <strong>Mouse:</strong> Yönlendir</span>
            <span>⚡ <strong>SPACE:</strong> İkiye Bölün (Split)</span>
            <span>🎯 <strong>W:</strong> Kütle / Yem Fırlat</span>
        </div>

        <button id="btn-play-agar" class="btn-play-agar">▶ OYUNA BAŞLA</button>
    </div>
</div>

<script src="agario.js"></script>
<script src="bgm.js"></script>
<script src="overlay-back.js"></script>
</body>
</html>
