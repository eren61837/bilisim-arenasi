<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌐 Slope 3D: Efsane Neon Top Yuvarlama - Bilişim Arenası</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #05070f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        /* TOP HUD */
        .top-hud {
            position: fixed;
            top: 14px; left: 16px; right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }
        .btn-nav {
            pointer-events: auto;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .btn-nav:hover {
            background: #00e5ff;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .stats-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hud-badge {
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
        }
        .hud-val {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #00e5ff;
            font-weight: 900;
        }
        /* OVERLAY START & GAME OVER */
        .overlay-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 15, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            transition: opacity 0.25s ease;
        }
        .overlay-modal.hidden {
            display: none;
        }
        .modal-card {
            background: linear-gradient(135deg, #0d121f 0%, #171f33 100%);
            border: 2px solid #00e5ff;
            border-radius: 20px;
            padding: 36px 44px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.3);
            animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .game-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00e5ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .game-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .score-big {
            font-family: 'Courier New', monospace;
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 12px;
        }
        .highscore-text {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .btn-play {
            width: 100%;
            background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
            color: #000;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 25px rgba(0, 229, 255, 0.5);
            transition: all 0.2s ease;
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(0, 229, 255, 0.8);
        }
        .keys-tip {
            margin-top: 18px;
            color: #64748b;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .keys-tip kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00e5ff;
            font-weight: 800;
        }
        /* MOBILE TOUCH CONTROLS */
        .touch-controls {
            position: fixed;
            bottom: 20px; left: 0; right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 200;
            pointer-events: none;
        }
        .touch-btn {
            pointer-events: auto;
            width: 90px; height: 90px;
            background: rgba(13, 17, 23, 0.7);
            border: 2px solid #00e5ff;
            border-radius: 50%;
            color: #00e5ff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            backdrop-filter: blur(6px);
        }
        @media (pointer: coarse) {
            .touch-controls { display: flex; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- TOP HUD -->
    <header class="top-hud">
        <a href="/" class="btn-nav">🏠 Portale Dön</a>
        <div class="stats-wrap">
            <div class="hud-badge">
                <span>⚡ HIZ:</span>
                <span class="hud-val" id="hud-speed">25</span>
            </div>
            <div class="hud-badge">
                <span>🏆 EN İYİ:</span>
                <span class="hud-val" id="hud-high" style="color:#ffd700;">0</span>
            </div>
            <div class="hud-badge">
                <span>⭐ SKOR:</span>
                <span class="hud-val" id="hud-score">0</span>
            </div>
        </div>
    </header>

    <!-- START MODAL -->
    <div id="modal-start" class="overlay-modal">
        <div class="modal-card">
            <div style="font-size: 54px; margin-bottom: 10px;">🌐</div>
            <h1 class="game-title">SLOPE 3D</h1>
            <p class="game-desc">
                Neon yamaçlardan aşağı son hızla yuvarlan! Kırmızı engellere çarpmadan ilerle, rampalardan uç ve en yüksek skoru yap!
            </p>
            <button class="btn-play" id="btn-start-game">OYNA (SPACE / TIKLA) 🚀</button>
            <div class="keys-tip">
                <span><kbd>A</kbd> / <kbd>D</kbd> veya <kbd>←</kbd> / <kbd>→</kbd> Yönlendir</span>
            </div>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="modal-gameover" class="overlay-modal hidden">
        <div class="modal-card">
            <div style="font-size: 54px; margin-bottom: 8px;">💥</div>
            <h2 style="font-size: 28px; font-weight: 900; color: #ff5252; margin-bottom: 8px;">TOP PARÇALANDI!</h2>
            <div class="score-big" id="go-score">0</div>
            <div class="highscore-text" id="go-high">👑 Rekorun: 0</div>
            <button class="btn-play" id="btn-restart-game">TEKRAR DENE 🔄</button>
            <div class="keys-tip">
                <span><kbd>SPACE</kbd> veya Ekrana Dokun</span>
            </div>
        </div>
    </div>

    <!-- TOUCH CONTROLS -->
    <div class="touch-controls">
        <div class="touch-btn" id="touch-left">◀</div>
        <div class="touch-btn" id="touch-right">▶</div>
    </div>

    <script src="overlay-back.js"></script>

    <script>
    (function() {
        'use strict';

        // --- WEB AUDIO SOUND SYNTHESIZER ---
        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            },
            roll() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(60, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
                } catch(_) {}
            },
            jump() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.25);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(now + 0.25);
                } catch(_) {}
            },
            crash() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(now + 0.4);
                } catch(_) {}
            }
        };

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x05070f, 1);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070f, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 800);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0x00e5ff, 0x05070f, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- GAME STATE ---
        const state = {
            running: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('slope_high_score') || '0', 10),
            speed: 26,
            steer: 0,
            ballPos: new THREE.Vector3(0, 1.5, 0),
            ballVelY: 0,
            isGrounded: true,
            cameraTilt: 0,
            keys: {}
        };

        // Update High Score UI
        document.getElementById('hud-high').textContent = state.highScore;

        // --- BALL CREATION ---
        const ballRadius = 1.0;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 24, 24);
        const ballMat = new THREE.MeshStandardMaterial({
            color: 0x00ffff,
            emissive: 0x0088aa,
            roughness: 0.2,
            metalness: 0.8
        });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);
        scene.add(ballMesh);

        // Neon Glow Light on Ball
        const ballLight = new THREE.PointLight(0x00ffff, 2, 20);
        scene.add(ballLight);

        // --- TRACK TILES & OBSTACLES SYSTEM ---
        const TILE_LENGTH = 16;
        const TILE_WIDTH = 12;
        const activeTiles = [];
        const activeObstacles = [];

        const tileMat = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            roughness: 0.4,
            metalness: 0.6
        });
        const borderMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
        const redObstacleMat = new THREE.MeshStandardMaterial({
            color: 0xff0055,
            emissive: 0xbb0033,
            roughness: 0.3,
            metalness: 0.5
        });

        let nextZ = 0;
        let nextY = 0;
        let nextX = 0;

        function createTile(x, y, z, rotX = 0) {
            const tileGroup = new THREE.Group();
            tileGroup.position.set(x, y, z);
            tileGroup.rotation.x = rotX;

            const boxGeo = new THREE.BoxGeometry(TILE_WIDTH, 1.2, TILE_LENGTH);
            const box = new THREE.Mesh(boxGeo, tileMat);
            tileGroup.add(box);

            // Left & Right Neon Borders
            const borderGeo = new THREE.BoxGeometry(0.3, 1.4, TILE_LENGTH);
            const borderL = new THREE.Mesh(borderGeo, borderMat);
            borderL.position.x = -TILE_WIDTH / 2;
            tileGroup.add(borderL);

            const borderR = new THREE.Mesh(borderGeo, borderMat);
            borderR.position.x = TILE_WIDTH / 2;
            tileGroup.add(borderR);

            scene.add(tileGroup);

            const tileData = {
                mesh: tileGroup,
                x, y, z,
                width: TILE_WIDTH,
                length: TILE_LENGTH,
                rotX
            };
            activeTiles.push(tileData);

            // Spawn Obstacles (after initial 3 safe tiles)
            if (activeTiles.length > 4 && Math.random() < 0.65) {
                spawnObstaclesOnTile(tileData);
            }

            return tileData;
        }

        function spawnObstaclesOnTile(tile) {
            const obsCount = Math.random() < 0.35 ? 2 : 1;
            const lanes = [-3.5, 0, 3.5];

            for (let i = 0; i < obsCount; i++) {
                const laneX = lanes[Math.floor(Math.random() * lanes.length)];
                const obsGeo = new THREE.BoxGeometry(1.6, 2.2, 1.6);
                const obs = new THREE.Mesh(obsGeo, redObstacleMat);

                const localZ = (Math.random() - 0.5) * (TILE_LENGTH - 4);
                obs.position.set(tile.x + laneX, tile.y + 1.6, tile.z + localZ);
                scene.add(obs);

                activeObstacles.push({
                    mesh: obs,
                    x: obs.position.x,
                    y: obs.position.y,
                    z: obs.position.z,
                    radius: 1.1
                });
            }
        }

        function initTrack() {
            // Clean previous
            activeTiles.forEach(t => scene.remove(t.mesh));
            activeTiles.length = 0;
            activeObstacles.forEach(o => scene.remove(o.mesh));
            activeObstacles.length = 0;

            nextZ = 0;
            nextY = 0;
            nextX = 0;

            // Generate initial flat and safe runway
            for (let i = 0; i < 18; i++) {
                extendTrack();
            }
        }

        function extendTrack() {
            // Curving / Sloping procedural logic
            const slopeRoll = Math.random();
            let rotX = 0;
            if (activeTiles.length > 5) {
                if (slopeRoll < 0.25) rotX = 0.08; // downhill
                else if (slopeRoll < 0.4) rotX = -0.05; // slight ramp
            }

            createTile(nextX, nextY, nextZ, rotX);

            nextZ -= TILE_LENGTH;
            nextY -= Math.sin(rotX) * TILE_LENGTH;
            if (activeTiles.length > 8 && Math.random() < 0.25) {
                nextX += (Math.random() - 0.5) * 6;
                nextX = Math.max(-12, Math.min(12, nextX));
            }
        }

        // --- COLLISION & PHYSICS ---
        function updatePhysics(dt) {
            // Steering
            let steerTarget = 0;
            if (state.keys['a'] || state.keys['arrowleft']) steerTarget -= 1;
            if (state.keys['d'] || state.keys['arrowright']) steerTarget += 1;

            state.steer += (steerTarget - state.steer) * 12 * dt;
            state.ballPos.x += state.steer * 20 * dt;
            state.ballPos.z -= state.speed * dt;

            // Roll sound & acceleration
            state.speed = Math.min(55, state.speed + dt * 0.4);
            Sound.roll();

            // Find current ground tile beneath the ball
            let groundTile = null;
            for (const t of activeTiles) {
                const zDist = Math.abs(state.ballPos.z - t.z);
                if (zDist <= TILE_LENGTH / 2 + 1) {
                    groundTile = t;
                    break;
                }
            }

            if (groundTile) {
                const halfW = groundTile.width / 2;
                if (Math.abs(state.ballPos.x - groundTile.x) <= halfW) {
                    // On track surface
                    const targetY = groundTile.y + 0.6 + ballRadius;
                    if (state.ballPos.y <= targetY + 0.2) {
                        state.ballPos.y = targetY;
                        state.ballVelY = 0;
                        state.isGrounded = true;
                    } else {
                        // In air over track
                        state.ballVelY -= 48 * dt; // Gravity
                        state.ballPos.y += state.ballVelY * dt;
                        state.isGrounded = false;
                    }
                } else {
                    // Slipped off sides!
                    state.ballVelY -= 55 * dt;
                    state.ballPos.y += state.ballVelY * dt;
                    state.isGrounded = false;
                }
            } else {
                // Fallen off track gap!
                state.ballVelY -= 55 * dt;
                state.ballPos.y += state.ballVelY * dt;
                state.isGrounded = false;
            }

            // Update Ball 3D Mesh & Rotation
            ballMesh.position.copy(state.ballPos);
            ballLight.position.copy(state.ballPos);
            ballMesh.rotation.x -= (state.speed * dt) / ballRadius;
            ballMesh.rotation.z -= (state.steer * dt * 15);

            // Obstacle Collisions
            for (const obs of activeObstacles) {
                const dx = state.ballPos.x - obs.x;
                const dy = state.ballPos.y - obs.y;
                const dz = state.ballPos.z - obs.z;
                const distSq = dx * dx + dy * dy + dz * dz;

                if (distSq < (ballRadius + obs.radius) * (ballRadius + obs.radius)) {
                    triggerGameOver();
                    return;
                }
            }

            // Fall-out death
            if (state.ballPos.y < -35) {
                triggerGameOver();
                return;
            }

            // Track Streaming & Garbage Collection
            if (activeTiles.length > 0 && activeTiles[0].z > state.ballPos.z + 40) {
                const oldTile = activeTiles.shift();
                scene.remove(oldTile.mesh);
                extendTrack();
            }

            // Clean old obstacles
            for (let i = activeObstacles.length - 1; i >= 0; i--) {
                if (activeObstacles[i].z > state.ballPos.z + 40) {
                    scene.remove(activeObstacles[i].mesh);
                    activeObstacles.splice(i, 1);
                }
            }

            // Score Progression
            state.score = Math.floor(Math.abs(state.ballPos.z) / 4);
            document.getElementById('hud-score').textContent = state.score;
            document.getElementById('hud-speed').textContent = Math.floor(state.speed);

            // Dynamic Smooth 3rd-Person Camera
            const camTargetX = state.ballPos.x * 0.6;
            const camTargetY = state.ballPos.y + 3.8;
            const camTargetZ = state.ballPos.z + 7.5;

            camera.position.x += (camTargetX - camera.position.x) * 10 * dt;
            camera.position.y += (camTargetY - camera.position.y) * 10 * dt;
            camera.position.z += (camTargetZ - camera.position.z) * 15 * dt;

            state.cameraTilt += (state.steer * -0.15 - state.cameraTilt) * 8 * dt;
            camera.rotation.z = state.cameraTilt;
            camera.lookAt(state.ballPos.x, state.ballPos.y + 0.5, state.ballPos.z - 8);
        }

        // --- GAME CONTROLS & LIFECYCLE ---
        function startGame() {
            Sound.jump();
            document.getElementById('modal-start').classList.add('hidden');
            document.getElementById('modal-gameover').classList.add('hidden');

            state.running = true;
            state.score = 0;
            state.speed = 26;
            state.steer = 0;
            state.ballVelY = 0;
            state.ballPos.set(0, 1.8, 0);

            camera.position.set(0, 5, 8);
            camera.lookAt(0, 1, -10);

            initTrack();
        }

        function triggerGameOver() {
            Sound.crash();
            state.running = false;

            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('slope_high_score', state.highScore);
                document.getElementById('hud-high').textContent = state.highScore;
            }

            document.getElementById('go-score').textContent = state.score;
            document.getElementById('go-high').textContent = '👑 Rekorun: ' + state.highScore;
            document.getElementById('modal-gameover').classList.remove('hidden');
        }

        // Keyboard Listeners
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            state.keys[k] = true;
            if (e.key === ' ' || e.key === 'Enter') {
                if (!state.running) {
                    e.preventDefault();
                    startGame();
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            state.keys[e.key.toLowerCase()] = false;
        });

        // Touch Listeners
        const btnLeft = document.getElementById('touch-left');
        const btnRight = document.getElementById('touch-right');
        if (btnLeft && btnRight) {
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys['arrowleft'] = true; });
            btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); state.keys['arrowleft'] = false; });
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys['arrowright'] = true; });
            btnRight.addEventListener('touchend', (e) => { e.preventDefault(); state.keys['arrowright'] = false; });
        }

        document.getElementById('btn-start-game').addEventListener('click', startGame);
        document.getElementById('btn-restart-game').addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN RENDER LOOP ---
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            if (state.running) {
                updatePhysics(dt);
            }
            renderer.render(scene, camera);
        }
        initTrack();
        requestAnimationFrame(animate);

    })();
    </script>
</body>
</html>
