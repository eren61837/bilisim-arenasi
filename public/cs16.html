<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔫 Counter-Strike 1.6 Online Web - Bilişim Arenası</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
            color: #fff;
            user-select: none;
        }

        /* TOP NAVIGATION BAR */
        .cs-top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(13, 17, 23, 0.96);
            border-bottom: 2px solid #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            gap: 12px;
        }

        .cs-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-cs-nav {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .btn-cs-nav:hover {
            background: #ff9800;
            color: #000;
            transform: translateY(-1px);
        }

        .cs-servers-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .cs-server-btn {
            background: transparent;
            color: #aaa;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cs-server-btn.active {
            background: #ff9800;
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .cs-badge-live {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .cs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* CS ENGINE IFRAME */
        #cs-game-frame {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px - 30px);
            border: none;
            display: block;
            z-index: 10;
            background: #000;
        }

        /* BOTTOM CONTROLS RIBBON */
        .cs-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: rgba(13, 17, 23, 0.98);
            border-top: 1px solid rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 11px;
            color: #aaa;
            z-index: 2000;
            user-select: none;
        }
        .cs-key-tip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .cs-key-tip kbd {
            background: #21262d;
            border: 1px solid #ff9800;
            color: #ff9800;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 800;
            font-family: inherit;
        }

        /* CLICK TO PLAY POINTER LOCK OVERLAY */
        #cs-click-overlay {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px - 30px);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        #cs-click-overlay.hidden {
            display: none;
        }
        .cs-play-card {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #ff9800;
            border-radius: 14px;
            padding: 24px 36px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.4);
            animation: pulsePlay 1.5s infinite alternate;
        }
        @keyframes pulsePlay {
            from { transform: scale(1); }
            to { transform: scale(1.03); box-shadow: 0 0 60px rgba(255, 152, 0, 0.7); }
        }

        /* LOADING SPINNER */
        #cs-loader {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px);
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            color: #ff9800;
            gap: 16px;
        }
        .cs-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 152, 0, 0.2);
            border-top-color: #ff9800;
            border-radius: 50%;
            animation: csSpin 1s linear infinite;
        }
        @keyframes csSpin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION & SERVER CONTROL BAR -->
    <header class="cs-top-bar">
        <div class="cs-brand">
            <a href="/" class="btn-cs-nav">🏠 Portale Dön</a>
            <span style="font-weight:900; font-size:14px; color:#ff9800; letter-spacing:0.5px;">🔫 COUNTER-STRIKE 1.6</span>
            <div class="cs-servers-group">
                <button class="cs-server-btn active" id="btn-engine-playcs" onclick="switchEngine('playcs')">Motor 1 (Play-CS)</button>
                <button class="cs-server-btn" id="btn-engine-kirka" onclick="switchEngine('kirka')">Motor 2 (Kirka Dust 2 - Doğrulamasız)</button>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="cs-actions">
            <button class="btn-cs-nav" style="background:linear-gradient(135deg, #00e5ff, #0088ff); color:#000; font-weight:900;" onclick="openDirectPlayCS()" title="Cloudflare Doğrulamasını Anında Geçer">🚀 Doğrudan Pencerede Aç</button>
            <button class="btn-cs-nav" id="btn-lock-pointer" onclick="lockGamePointer()">🎯 Fareyi Kilitle</button>
            <button class="btn-cs-nav" id="btn-fullscreen" onclick="toggleFullscreen()">⛶ Tam Ekran</button>
            <button class="btn-cs-nav" id="btn-reload" onclick="reloadGame()">🔄 Yenile</button>
        </div>
    </header>

    <!-- CLOUDFLARE BYPASS PROMPT BANNER -->
    <div id="cs-direct-hint" style="position:fixed; top:54px; left:50%; transform:translateX(-50%); background:rgba(15, 23, 42, 0.95); border:2px solid #00e5ff; border-radius:10px; padding:10px 20px; font-size:13px; color:#fff; z-index:1500; display:flex; align-items:center; gap:14px; box-shadow:0 0 30px rgba(0,229,255,0.4);">
        <span>⚠️ Cloudflare <strong>"Verify your browser"</strong> döngüsünde kalıyorsan:</span>
        <button onclick="openDirectPlayCS()" style="background:linear-gradient(135deg, #ff9800, #ff5722); color:#000; font-weight:900; font-size:12px; border:none; padding:7px 16px; border-radius:6px; cursor:pointer; box-shadow:0 0 15px rgba(255,152,0,0.5);">🚀 PENCEREDE AÇ (DOĞRULAMAYI ATLA)</button>
        <button onclick="switchEngine('kirka')" style="background:linear-gradient(135deg, #00e676, #00a843); color:#000; font-weight:900; font-size:12px; border:none; padding:7px 16px; border-radius:6px; cursor:pointer;">🎮 MOTOR 2'YE GEÇ (DOĞRULAMASIZ)</button>
    </div>

    <!-- LOADING SCREEN -->
    <div id="cs-loader">
        <div class="cs-spinner"></div>
        <h2 style="font-size:18px; letter-spacing:1px;" id="cs-loader-title">Counter-Strike 1.6 Sunucuları Yükleniyor...</h2>
        <p style="font-size:12px; color:#888;">Lütfen bekleyin...</p>
    </div>

    <!-- AUTHENTIC CS 1.6 WEB ENGINE IFRAME -->
    <iframe id="cs-game-frame" 
            src="https://play-cs.com/en/servers" 
            allow="autoplay; fullscreen; pointer-lock; camera; microphone; clipboard-write; web-share"
            tabindex="0">
    </iframe>

    <!-- BOTTOM CONTROLS RIBBON -->
    <footer class="cs-bottom-bar">
        <div class="cs-key-tip"><kbd>WASD</kbd> Hareket</div>
        <div class="cs-key-tip"><kbd>SOL TIK</kbd> Ateş</div>
        <div class="cs-key-tip"><kbd>SAĞ TIK</kbd> Dürbün / Susturucu</div>
        <div class="cs-key-tip"><kbd>R</kbd> Şarjör</div>
        <div class="cs-key-tip"><kbd>B</kbd> Silah Menüsü</div>
        <div class="cs-key-tip"><kbd>SPACE</kbd> Zıpla</div>
        <div class="cs-key-tip"><kbd>CTRL</kbd> Çömel</div>
        <div class="cs-key-tip"><kbd>TAB</kbd> Skor</div>
        <div class="cs-key-tip"><kbd>ESC</kbd> Menü / Fare Kilidi Aç</div>
    </footer>

    <script>
        const frame = document.getElementById('cs-game-frame');
        const loader = document.getElementById('cs-loader');
        const hint = document.getElementById('cs-direct-hint');

        frame.onload = function() {
            setTimeout(() => {
                if (loader) loader.style.display = 'none';
                frame.focus();
                try {
                    if (frame.contentWindow) frame.contentWindow.focus();
                } catch(_) {}
            }, 600);
            setTimeout(() => {
                if (hint) hint.style.opacity = '0';
                setTimeout(() => { if (hint) hint.remove(); }, 500);
            }, 5000);
        };

        function lockGamePointer() {
            try {
                frame.focus();
                if (frame.contentWindow) {
                    frame.contentWindow.focus();
                }
            } catch (_) {}
        }

        function reloadGame() {
            if (loader) loader.style.display = 'flex';
            frame.src = frame.src;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function openDirectPlayCS() {
            window.open('https://play-cs.com/en/servers', '_blank', 'width=1280,height=720');
        }

        function switchEngine(engine) {
            const btnPlayCS = document.getElementById('btn-engine-playcs');
            const btnKirka = document.getElementById('btn-engine-kirka');
            const title = document.getElementById('cs-loader-title');

            if (loader) loader.style.display = 'flex';

            if (engine === 'kirka') {
                if (btnKirka) btnKirka.classList.add('active');
                if (btnPlayCS) btnPlayCS.classList.remove('active');
                if (title) title.textContent = 'Kirka Dust 2 (Doğrulamasız CS) Yükleniyor...';
                frame.src = 'https://kirka.io/';
                if (hint) hint.style.display = 'none';
            } else {
                if (btnPlayCS) btnPlayCS.classList.add('active');
                if (btnKirka) btnKirka.classList.remove('active');
                if (title) title.textContent = 'Counter-Strike 1.6 Sunucuları Yükleniyor...';
                frame.src = 'https://play-cs.com/en/servers';
                if (hint) hint.style.display = 'flex';
            }
        }

        // Direct auto-focus on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                lockGamePointer();
            }, 800);
        });
    </script>
</body>
</html>
