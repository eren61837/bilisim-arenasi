<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔫 Counter-Strike 1.6 Online Web - Bilişim Arenası</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
            color: #fff;
            user-select: none;
        }

        /* TOP NAVIGATION BAR */
        .cs-top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(13, 17, 23, 0.96);
            border-bottom: 2px solid #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            gap: 12px;
        }

        .cs-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-cs-nav {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
            border: 1px solid #ff9800;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .btn-cs-nav:hover {
            background: #ff9800;
            color: #000;
            transform: translateY(-1px);
        }

        .cs-servers-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .cs-server-btn {
            background: transparent;
            color: #aaa;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cs-server-btn.active {
            background: #ff9800;
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .cs-badge-live {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .cs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* CS ENGINE IFRAME */
        #cs-game-frame {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px);
            border: none;
            display: block;
            z-index: 10;
            background: #000;
        }

        /* LOADING SPINNER */
        #cs-loader {
            position: fixed;
            top: 48px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px);
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            color: #ff9800;
            gap: 16px;
        }
        .cs-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 152, 0, 0.2);
            border-top-color: #ff9800;
            border-radius: 50%;
            animation: csSpin 1s linear infinite;
        }
        @keyframes csSpin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION & SERVER CONTROL BAR -->
    <header class="cs-top-bar">
        <div class="cs-brand">
            <a href="/" class="btn-cs-nav">🏠 Portale Dön</a>
            <span style="font-weight:900; font-size:14px; color:#ff9800; letter-spacing:0.5px;">🔫 COUNTER-STRIKE 1.6 WEB</span>
            <span class="cs-badge-live">🟢 Hazır İnternet Motoru (WASM)</span>
        </div>

        <!-- SERVER / ENGINE SWITCHER -->
        <div class="cs-servers-group">
            <span style="font-size:11px; color:#888; font-weight:700; margin-right:4px;">SUNUCU:</span>
            <button class="cs-server-btn active" id="btn-srv-csjs" onclick="switchServer('csjs')">⚡ CSJS.live (Dust2 / Pro)</button>
            <button class="cs-server-btn" id="btn-srv-playcs" onclick="switchServer('playcs')">🌐 Play-CS.com (Global)</button>
        </div>

        <!-- ACTIONS -->
        <div class="cs-actions">
            <button class="btn-cs-nav" id="btn-fullscreen" onclick="toggleFullscreen()">⛶ Tam Ekran</button>
            <button class="btn-cs-nav" id="btn-reload" onclick="reloadGame()">🔄 Yenile</button>
        </div>
    </header>

    <!-- LOADING SCREEN -->
    <div id="cs-loader">
        <div class="cs-spinner"></div>
        <h2 style="font-size:18px; letter-spacing:1px;">Counter-Strike 1.6 Web Başlatılıyor...</h2>
        <p style="font-size:12px; color:#888;">Gerçek online sunuculara ve botlara doğrudan bağlanılıyor.</p>
    </div>

    <!-- AUTHENTIC CS 1.6 WEB ENGINE IFRAME -->
    <iframe id="cs-game-frame" 
            src="https://csjs.live/" 
            allow="autoplay; fullscreen; pointer-lock; camera; microphone; clipboard-write; web-share"
            tabindex="0">
    </iframe>

    <script>
        const SERVERS = {
            csjs: 'https://csjs.live/',
            playcs: 'https://play-cs.com/'
        };

        const frame = document.getElementById('cs-game-frame');
        const loader = document.getElementById('cs-loader');

        frame.onload = function() {
            setTimeout(() => {
                if (loader) loader.style.display = 'none';
            }, 600);
        };

        function switchServer(key) {
            document.querySelectorAll('.cs-server-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById('btn-srv-' + key);
            if (targetBtn) targetBtn.classList.add('active');

            if (loader) loader.style.display = 'flex';
            if (SERVERS[key]) {
                frame.src = SERVERS[key];
            }
        }

        function reloadGame() {
            if (loader) loader.style.display = 'flex';
            frame.src = frame.src;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }
    </script>
</body>
</html>
