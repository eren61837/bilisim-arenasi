<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ DIEP.IO - Bilişim Arenası</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link rel="stylesheet" href="diep.css">
</head>
<body>

    <!-- TOPBAR -->
    <header class="diep-topbar">
        <div class="diep-brand">
            <a href="/" class="btn-diep-nav">🏠 PORTALE DÖN</a>
            <div class="diep-title-text">
                <span>🛡️</span> DIEP.IO TANK ARENASI
            </div>
        </div>

        <div class="diep-stats-badges">
            <span class="diep-tag" id="diep-player-tag">👤 Oyuncu</span>
            <span class="diep-tag">⭐ 45 Tank Sınıfı</span>
            <span class="diep-tag">⚡ 60 FPS Native</span>
        </div>

        <div class="diep-actions">
            <button class="btn-diep-nav" id="btn-fullscreen">⛶ Tam Ekran</button>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main id="game-container">
        <canvas id="diep-canvas"></canvas>

        <!-- CLASS EVOLUTION DOCK (Appears at Level 15, 30, 45) -->
        <div id="class-dock"></div>

        <!-- STAT UPGRADES DOCK -->
        <div id="stats-dock"></div>

        <!-- LEADERBOARD -->
        <div id="leaderboard">
            <div class="lb-title">🏆 LİDERLİK TABLOSU</div>
            <div id="lb-list"></div>
        </div>

        <!-- MINIMAP -->
        <div id="minimap-wrap">
            <canvas id="minimap-canvas"></canvas>
        </div>

        <!-- BOTTOM HUD (SCORE & LEVEL BAR) -->
        <div id="bottom-hud">
            <div class="score-text" id="hud-score">Skor: 0</div>
            <div class="xp-bar-track">
                <div class="xp-bar-fill" id="hud-xp-fill"></div>
                <span class="level-badge" id="hud-level-text">Lvl 1 Tank</span>
            </div>
        </div>

        <!-- RESPAWN MODAL -->
        <div id="modal-respawn" class="hidden">
            <div class="respawn-card">
                <h2>💥 TANKIN YOK EDİLDİ!</h2>
                <p class="respawn-score">Elde ettiğin skor: <strong id="respawn-score-val" style="color:#ffd700;">0</strong></p>
                <button class="btn-respawn" id="btn-respawn">YENİDEN DOĞ 🚀</button>
            </div>
        </div>
    </main>

    <script src="diep.js"></script>
    <script src="overlay-back.js"></script>
</body>
</html>
