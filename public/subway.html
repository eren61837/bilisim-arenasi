<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏃 Subway Surfers Web - Bilişim Arenası</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
            color: #fff;
            user-select: none;
        }

        /* TOP NAVIGATION BAR */
        .subway-top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(13, 17, 23, 0.96);
            border-bottom: 2px solid #00dbff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            gap: 12px;
        }

        .subway-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-subway-nav {
            background: rgba(0, 219, 255, 0.12);
            color: #00dbff;
            border: 1px solid #00dbff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .btn-subway-nav:hover {
            background: #00dbff;
            color: #000;
            transform: translateY(-1px);
            box-shadow: 0 0 12px rgba(0, 219, 255, 0.5);
        }

        .source-select {
            background: #161b22;
            color: #00dbff;
            border: 1px solid rgba(0, 219, 255, 0.4);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        /* MAIN IFRAME */
        #subway-frame {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            height: calc(100% - 48px - 30px);
            border: none;
            z-index: 10;
            background: #000;
        }

        /* BOTTOM CONTROLS RIBBON */
        .subway-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 30px;
            background: rgba(13, 17, 23, 0.98);
            border-top: 1px solid rgba(0, 219, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 11px;
            color: #aaa;
            z-index: 2000;
        }
        .key-tip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .key-tip kbd {
            background: #21262d;
            border: 1px solid #00dbff;
            color: #00dbff;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 800;
            font-family: inherit;
        }

        /* LOADER */
        #subway-loader {
            position: absolute;
            top: 48px; left: 0; right: 0; bottom: 30px;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 15px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(0, 219, 255, 0.2);
            border-top: 4px solid #00dbff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="subway-top-bar">
        <div class="subway-brand">
            <a href="/" class="btn-subway-nav">⬅ Arenaya Dön</a>
            <span style="font-weight:900; font-size:15px; letter-spacing:0.5px; color:#fff;">🏃 SUBWAY SURFERS</span>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
            <label style="font-size:11px; color:#aaa;">Kaynak:</label>
            <select id="source-select" class="source-select" onchange="switchSource(this.value)">
                <option value="https://ubg98.github.io/SubwaySurfers/">🟢 Sunucu 1 (Hızlı GitHub)</option>
                <option value="https://subway-surfers.org/">⚡ Sunucu 2 (Original Web)</option>
                <option value="https://subwaysurfers.world/">🔥 Sunucu 3 (Alternatif)</option>
            </select>
            <button class="btn-subway-nav" onclick="toggleFullscreen()">⛶ Tam Ekran</button>
            <button class="btn-subway-nav" onclick="openDirect()">↗ Yeni Sekmede Aç</button>
            <button class="btn-subway-nav" onclick="reloadFrame()">🔄 Yenile</button>
        </div>
    </header>

    <div id="subway-loader">
        <div class="spinner"></div>
        <h3 style="color:#00dbff;">Subway Surfers Yükleniyor...</h3>
        <p style="font-size:12px; color:#888;">Raylarda koşmaya hazır ol! Tuşlar: Yön Tuşları veya WASD</p>
    </div>

    <iframe id="subway-frame"
            src="https://ubg98.github.io/SubwaySurfers/"
            allow="autoplay; fullscreen; pointer-lock; keyboard"
            tabindex="0">
    </iframe>

    <footer class="subway-bottom-bar">
        <div class="key-tip"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> Şerit Değiştir</div>
        <div class="key-tip"><kbd>↑</kbd> / <kbd>W</kbd> Zıpla</div>
        <div class="key-tip"><kbd>↓</kbd> / <kbd>S</kbd> Yuvarlan</div>
        <div class="key-tip"><kbd>SPACE</kbd> Kaykay Kullan (Hoverboard)</div>
        <div style="color:#00dbff; font-weight:bold;">⚡ Poki En İyiler • MEB Filtre Korumalı</div>
    </footer>

    <script>
        const frame = document.getElementById('subway-frame');
        const loader = document.getElementById('subway-loader');

        frame.onload = function() {
            setTimeout(() => {
                if (loader) loader.style.display = 'none';
                frame.focus();
                try { if (frame.contentWindow) frame.contentWindow.focus(); } catch(_) {}
            }, 600);
        };

        function switchSource(url) {
            if (loader) loader.style.display = 'flex';
            frame.src = url;
        }

        function reloadFrame() {
            if (loader) loader.style.display = 'flex';
            frame.src = frame.src;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function openDirect() {
            window.open(frame.src, '_blank');
        }

        window.addEventListener('click', () => {
            frame.focus();
        });
    </script>
</body>
</html>
