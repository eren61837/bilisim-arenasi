<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers - Bilişim Arenası</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117; /* Dark cyber theme */
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-item { margin-bottom: 8px; }
        .hud-icon { color: #f1e05a; }
        
        #back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            z-index: 20;
            cursor: pointer;
            transition: 0.3s;
        }
        #back-button:hover { background: #4caf50; color: black; }

        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 30px;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
                justify-content: space-between;
                padding: 0 30px;
                box-sizing: border-box;
            }
        }
        .control-btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            backdrop-filter: blur(4px);
        }
        .control-btn:active { background: rgba(255,255,255,0.4); }
        .controls-group { display: flex; gap: 15px; }
        
        #subway-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <a href="/" id="back-button">🏠 PORTALE DÖN</a>

    <div id="hud">
        <div class="hud-item"><span class="hud-icon">🏆</span> Skor: <span id="hud-score">0</span></div>
        <div class="hud-item"><span class="hud-icon">🪙</span> Altın: <span id="hud-coins">0</span></div>
    </div>

    <canvas id="subway-canvas"></canvas>

    <div id="mobile-controls">
        <div class="controls-group">
            <div class="control-btn" id="btn-left">←</div>
            <div class="control-btn" id="btn-right">→</div>
        </div>
        <div class="control-btn" id="btn-jump">↑</div>
    </div>

    <!-- Load Local Libraries -->
    <script src="three.min.js"></script>
    <script src="subway.js"></script>
    <script src="overlay-back.js"></script>
    
    <script>
        function triggerKey(key) {
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key, code: key }));
            setTimeout(() => document.dispatchEvent(new KeyboardEvent('keyup', { key: key, code: key })), 100);
        }
        
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('ArrowLeft'); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('ArrowRight'); });
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('ArrowUp'); });
    </script>
</body>
</html>
