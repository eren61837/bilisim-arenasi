<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Oyunu - Bilişim Arenası</title>
    <link rel="stylesheet" href="sos.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🅂</text></svg>">
</head>
<body>
    <div id="sos-loading-screen" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-logo">🅂🅾🅂</div>
            <h1 class="loading-title">SOS ARENASI</h1>
            <p class="loading-subtitle">Bilişim Sınıfı Zeka &amp; Strateji Düellosu</p>
            <div class="loading-credits-box">
                <div class="credit-row">
                    <span class="credit-badge req">👑 İSTEYEN</span>
                    <span class="credit-name">Eyüp Kızıldere</span>
                </div>
                <div class="credit-row">
                    <span class="credit-badge dev">⚡ GELİŞTİREN</span>
                    <span class="credit-name">erencix</span>
                </div>
            </div>
            <div class="loading-bar-wrap">
                <div class="loading-bar-fill"></div>
            </div>
            <div class="loading-status">Hazırlanıyor...</div>
        </div>
    </div>

    <div class="header">
        <a href="/" class="back-btn">⬅ Ana Sayfa</a>
        <h1>SOS <span>Oyunu</span></h1>
        <div class="user-display">👤 <span id="player-name">Oyuncu</span></div>
    </div>

    <div class="container" id="menu-screen">
        <div class="menu-box">
            <h2>Yeni Oyun</h2>
            <div class="setting-group">
                <label>Izgara Boyutu:</label>
                <select id="grid-size">
                    <option value="10">10 x 10</option>
                    <option value="15">15 x 15</option>
                    <option value="20">20 x 20</option>
                    <option value="25" selected>25 x 25 (Dev Bilişim Sınıfı Izgarası)</option>
                </select>
            </div>
            <div class="menu-buttons">
                <button id="btn-vs-ai" class="btn-primary">🤖 Yapay Zekaya Karşı Oyna</button>
                <button id="btn-vs-friend" class="btn-secondary">👥 Arkadaşla Oyna (Oda Kur)</button>
                <button id="btn-join-friend" class="btn-accent">🤝 Hızlı Eşleş (Arkadaşa Katıl)</button>
            </div>
        </div>
    </div>

    <div class="container" id="waiting-screen" style="display:none;">
        <div class="menu-box">
            <h2>Rakip Bekleniyor...</h2>
            <div class="loader"></div>
            <p>Arkadaşın "Hızlı Eşleş" butonuna basarak sana katılabilir.</p>
            <p id="room-id-display" class="room-id"></p>
            <button id="btn-cancel-wait" class="btn-secondary" style="margin-top:20px;">İptal</button>
        </div>
    </div>

    <div class="game-area" id="game-screen" style="display:none;">
        <div class="scoreboard">
            <div class="player-score" id="p1-score-box">
                <div class="p-name" id="p1-name">Oyuncu 1</div>
                <div class="p-score" id="p1-score">0</div>
            </div>
            <div class="turn-indicator" id="turn-display">Sıra: Bekleniyor</div>
            <div class="player-score" id="p2-score-box">
                <div class="p-name" id="p2-name">Oyuncu 2</div>
                <div class="p-score" id="p2-score">0</div>
            </div>
        </div>

        <div class="letter-selector">
            <button id="btn-select-s" class="btn-letter active">S</button>
            <button id="btn-select-o" class="btn-letter">O</button>
        </div>

        <div class="grid-container" id="grid-container">
            <canvas id="game-canvas"></canvas>
            <canvas id="lines-canvas"></canvas>
        </div>
        
        <div class="game-over-box" id="game-over-box" style="display:none;">
            <h2 id="winner-text">Oyun Bitti!</h2>
            <button id="btn-back-menu" class="btn-primary">Ana Menü</button>
        </div>
    </div>

    <script src="overlay-back.js"></script>
    <script src="sos.js"></script>
</body>
</html>
